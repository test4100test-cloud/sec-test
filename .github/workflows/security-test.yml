name: Docker Image Inspection

on:
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect Internal Docker Images
        run: |
          echo "=== gh-aw-firewall agent ==="
          docker inspect ghcr.io/github/gh-aw-firewall/agent:latest 2>&1 | head -100
          echo ""
          echo "=== gh-aw-firewall agent env vars ==="
          docker inspect --format="{{json .Config.Env}}" ghcr.io/github/gh-aw-firewall/agent:latest 2>&1
          echo ""
          echo "=== gh-aw-firewall agent entrypoint ==="
          docker inspect --format="{{json .Config.Entrypoint}} {{json .Config.Cmd}}" ghcr.io/github/gh-aw-firewall/agent:latest 2>&1
          echo ""
          echo "=== api-proxy env ==="
          docker inspect --format="{{json .Config.Env}}" ghcr.io/github/gh-aw-firewall/api-proxy:latest 2>&1
          echo ""
          echo "=== api-proxy entrypoint ==="
          docker inspect --format="{{json .Config.Entrypoint}} {{json .Config.Cmd}}" ghcr.io/github/gh-aw-firewall/api-proxy:latest 2>&1
          echo ""
          echo "=== squid env ==="
          docker inspect --format="{{json .Config.Env}}" ghcr.io/github/gh-aw-firewall/squid:latest 2>&1
          echo ""
          echo "=== github-mcp-server env ==="
          docker inspect --format="{{json .Config.Env}}" ghcr.io/github/github-mcp-server:latest 2>&1
          echo ""
          echo "=== gh-aw-mcpg env ==="
          docker inspect --format="{{json .Config.Env}}" ghcr.io/github/gh-aw-mcpg:latest 2>&1
          echo ""
          echo "=== List files in firewall agent ==="
          docker run --rm --entrypoint ls ghcr.io/github/gh-aw-firewall/agent:latest -la / 2>&1 | head -30
          echo ""
          echo "=== List config in api-proxy ==="
          docker run --rm --entrypoint ls ghcr.io/github/gh-aw-firewall/api-proxy:latest -la / 2>&1 | head -30
          echo ""
          echo "=== Squid config ==="
          docker run --rm --entrypoint cat ghcr.io/github/gh-aw-firewall/squid:latest /etc/squid/squid.conf 2>&1 | head -50
          echo ""
          echo "=== Check for hardcoded tokens in images ==="
          for img in ghcr.io/github/gh-aw-firewall/agent ghcr.io/github/gh-aw-firewall/api-proxy ghcr.io/github/gh-aw-mcpg; do
            echo "--- $img ---"
            docker history --no-trunc "$img:latest" 2>&1 | grep -iE "token|secret|key|password|api_key|credential" | head -5
          done
          echo ""
          echo "=== Docker network info ==="
          docker network ls 2>&1
          echo ""
          echo "=== iptables rules ==="
          sudo iptables -L -n 2>&1 | head -30
          echo "=== Complete ==="
